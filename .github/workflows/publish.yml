name: Publish to VS Code Marketplace

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx --yes @vscode/vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: tulvez-code-vsix
          path: '*.vsix'

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: VSIX paketini üret
        run: npx --yes @vscode/vsce package
      - name: VS Code Marketplace'e yayınla
        run: npx --yes @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}
