name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # GitHub yayın kaydı ve VSIX eki için

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v5
        with:
          # Node 22 gerekir: Node 20'de jsdom -> html-encoding-sniffer ->
          # @exodus/bytes zinciri ERR_REQUIRE_ESM hatası verir ve testler kılıtlanır.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Kural: bilgileri hazırlanmamış sürüm yayınlanmaz (package.json, CHANGELOG.md, surumler.json)
      - name: Sürüm bilgisi denetimi
        run: node scripts/surum-denetimi.mjs "${GITHUB_REF#refs/tags/}"

      - name: Tip kontrolü
        run: npm run check

      - name: Testler
        run: npm test

      - name: Build
        run: npm run build

      # Tek paket: Marketplace'e yüklenen VSIX'in aynısı GitHub yayınına da eklenir
      - name: VSIX üret ve yayınla
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VSIX="tulvez-code-${TAG_NAME#v}.vsix"
          if [[ "$TAG_NAME" == *-beta* || "$TAG_NAME" == *-alpha* || "$TAG_NAME" == *-rc* ]]; then
            npx @vscode/vsce package --pre-release -o "$VSIX"
            npx @vscode/vsce publish --packagePath "$VSIX" -p ${{ secrets.VSCE_PAT }}   # ön sürüm bilgisi paketin içinde
          else
            npx @vscode/vsce package -o "$VSIX"
            npx @vscode/vsce publish --packagePath "$VSIX" -p ${{ secrets.VSCE_PAT }}
          fi
          echo "VSIX=$VSIX" >> "$GITHUB_ENV"

      - name: GitHub yayın kaydı
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          node scripts/surum-notu.mjs "$TAG_NAME" > surum-notu.md
          ON=""; [[ "$TAG_NAME" == *-* ]] && ON="--prerelease"
          gh release create "$TAG_NAME" "$VSIX" --verify-tag $ON \
            --title "$(node scripts/surum-notu.mjs "$TAG_NAME" --baslik)" --notes-file surum-notu.md
