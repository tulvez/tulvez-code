name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Tip kontrolü
        run: npm run check

      - name: Testler
        run: npm test

      - name: Build
        run: npm run build

      - name: VSIX üret ve yayınla
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG_NAME" == *-beta* || "$TAG_NAME" == *-alpha* || "$TAG_NAME" == *-rc* ]]; then
            npx @vscode/vsce publish --pre-release -p ${{ secrets.VSCE_PAT }}
          else
            npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}
          fi
